<!DOCTYPE html> <!-- Defines that document is HTML5 -->
<html lang="en"> <!-- Root element of an HTML page. Good practice for accessibilty and search engine -->
<head> <!-- Metainformation about the HTML document (data not displayed to the user)-->
    <title>👩‍💻 devMode by Uxu❤️</title>

    <!-- This following line makes enables us to use Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>


</head>


<!-- This is the visible page content-->
<body id="main-layout" class="h-screen overflow-hidden"> 
    
    <!-- Grid container: layout for whole page 
        h-screen: It takes the whole screen in height

        grid-cols-[]: how many columns + their Width (rem and 1fr for responsivity)

        grid-rows-[]: how many rows + their Height
    
    -->
    <div id ="content-area" class="grid h-screen grid-cols-[3.5rem_15rem_1fr] grid-rows-[3rem_1fr_1.5rem]  bg-neutral-900 border-[0.5px] border-gray-400 border-opacity-15">

        <!-- Top Header: logo, searchbar, - X icons right --->
        <div class="col-span-3 p-2.5 border border-gray-400 border-opacity-15">
            <img src="assets/VsCodeLogo.png" class="h-full w-auto">
        </div>

        <!-- MAIN (vertically): Everything between top header and bottom -->
        <div id ="content-area" class="col-span-3 flex">

            <!-- Left column: icons-->
            <div class="w-[3.5rem] p-1 border border-gray-400 border-opacity-15">
                <button id="files-left-icon-btn">
                    <img src="assets/files_Icon.png">
                </button>
                
            </div>

            <!--Middle: files sidebar that appears and disappears -->
            <div id ="files-sidebar" class="hidden p-4 w-[15rem] border-[0.5px] border-gray-400 border-opacity-15 text-white">
                
                <!-- Title "Explorer"-->
                <div>
                    <p class="text-sm text-white text-opacity-80">EXPLORER</p> <!-- text-sm: text size -->
                </div>

                <!-- Files -->
                <!-- <div class="p-4 grid grid-cols-[1rem_1fr]"> -->
                <div class="p-4 flex items-center space-x-2">
                    <!-- Left: file icon-->
                    <div>
                        <img src="/assets/1file_Icon.png" class="h-4">
                    </div>
                    <!-- Right: filename -->
                    <div class="p-2">
                        <button>instructions.txt</button>
                    </div>
                    
                </div>
                
            </div>

            <!-- Right: Main part (grid): screen & terminal -->
            <div class="flex-1 grid grid-rows-[1fr_19rem]" >
                <!-- Screen-->
                <div class="bg-neutral-800 text-white">Screen</div>

                <!-- Terminal-->
                <div class="grid grid-rows-2 border-[0.5px] border-gray-400 border-opacity-15 text-white">
                    <!-- Titles -->
                    <div class="grid grid-cols-[3.5rem-1fr-3.5rem] p-4">
                        <p class="text-sm text-white text-opacity-80">TERMINAL</p> <!-- text-sm: text size -->
                    </div>

                    <!-- Input: User interaction-->
                    <div></div>
                </div>
            </div>
        </div>

        <!-- Bottom 
            · col-span-3: defines width. It specifies how many columns must take this element regardin its size.
        -->
        <div class="col-span-3 border-gray-400 border-opacity-15">
            <p class="text-white">Bottom info bar</p>
        </div>

        <script src="main.js"></script>
    </div>
    
    <!--
    - Top Header: logo, searchbar, - X icons right -
    <div class="w-full h-10 bg-neutral-900 border-[0.5px] border-gray-400 border-opacity-20"></div>

    -- L -
    <div class="w-14 h-screen bg-neutral-900 border-[0.5px] border-gray-400 border-opacity-20"></div>
    
    --  --
    <div class="h-52 bg-red-500"> </div>

    -- Bottom 
    <div class="flex-1 overflow-auto p-3 bg-neutral-900 border-[0.5px] border-gray-400 border-opacity-20"></div>
-->

</body>
</html>

<!--
Dark black: bg-neutral-900 border-[0.5px]
Light black: 
Gray border: border-gray-400 border-opacity-20

· rem is more accessible than fixed width size in pixels. Reason: it's responsive to letter size.
